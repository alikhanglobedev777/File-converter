name: Converter regression tests

on:
  pull_request:
    paths:
      - 'server/**'
      - 'client/pdf/**'
      - '.github/workflows/converter-tests.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/pdf/**'
      - '.github/workflows/converter-tests.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Run backend regression tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/pdf/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend regression tests
        run: npm test
      - name: Build production frontend
        run: npm run build
