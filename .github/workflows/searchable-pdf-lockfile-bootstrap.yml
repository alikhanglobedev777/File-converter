name: Searchable PDF lockfile bootstrap (temporary)
on:
  push:
    branches: [feat/ocr-searchable-pdf-2026-10-22]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lock changes
        working-directory: client/pdf
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Display lock changes for review
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const old = JSON.parse(execFileSync('git',['show','HEAD:client/pdf/package-lock.json'],{encoding:'utf8'}));
          const next = JSON.parse(fs.readFileSync('client/pdf/package-lock.json','utf8'));
          const changed = Object.fromEntries(Object.entries(next.packages).filter(([k,v])=>JSON.stringify(v)!==JSON.stringify(old.packages[k])));
          const removed = Object.keys(old.packages).filter(k=>!(k in next.packages));
          const top = Object.fromEntries(Object.entries(next).filter(([k])=>k!=='packages'));
          console.log('PDF_LOCK_DIFF_START');
          console.log(JSON.stringify({top,changed,removed}));
          console.log('PDF_LOCK_DIFF_END');
          NODE
